name: Run Tests

on:
  push:
    branches: [ anshika ]
  pull_request:
    branches: [ anshika ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest tests/ -v

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 app/ simulation/ validation/ --max-line-length=100 --extend-ignore=E203,W503